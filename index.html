<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cielo aperto – navigatore senza gallerie</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--cielo:#EAF4F7;--inchiostro:#1E2D35;--prato:#2C7A5B;--galleria:#C0432B;--sole:#F0B94B;--bianco:#fff;--grigio:#6A7C85;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--inchiostro);background:var(--cielo);overflow:hidden}
#map{position:absolute;inset:0}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);max-height:78%;overflow:auto;background:var(--bianco);border-radius:24px 24px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 28px rgba(30,45,53,.18);z-index:1000}
h1{font-size:1.15rem;margin:0 0 10px;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:2px solid #D3E1E7;border-radius:14px;background:var(--cielo);color:var(--inchiostro)}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sole);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--cielo);color:var(--inchiostro)}
button.main{width:100%;background:var(--prato);color:#fff;padding:14px;font-size:1.05rem}
button:disabled{opacity:.6}
#status{margin:8px 0 0;color:var(--grigio);min-height:1.4em}
#res{display:none;margin-top:12px}
.badge{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:#E3F3EA;color:#14543B}
.badge.warn{background:#FCEBD0;color:#6B4308}
.badge svg{flex:none;width:44px;height:44px}
.badge b{display:block;font-size:1.15rem}
.stats{display:flex;gap:18px;margin:12px 2px;font-weight:600}
.stats span{color:var(--grigio);font-weight:400}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;padding:6px 0}
ol{margin:6px 0 0;padding-left:22px}
li{padding:4px 0;border-bottom:1px solid #EEF3F5}
li em{color:var(--grigio);font-style:normal}
#follow{margin-top:8px;width:100%}
#follow.on{background:var(--sole)}
#banner{display:none;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:1001;background:var(--inchiostro);color:#fff;border-radius:18px;padding:14px 16px;max-width:520px;margin:auto}#bt{font-size:1.3rem;font-weight:700}#bs{opacity:.8;margin-top:2px}#stop{margin-top:10px;background:rgba(255,255,255,.18);color:#fff;padding:8px 14px}body.nav .sheet{display:none}
.note{font-size:.82rem;color:var(--grigio);margin:10px 0 0}
</style>
</head>
<body>
<div id="map"></div>
<div id="banner" role="status"><div id="bt"></div><div id="bs"></div><button id="stop">Termina navigazione</button></div>
<section class="sheet">
  <h1>Cielo aperto: percorsi senza gallerie</h1>
  <div class="row">
    <input id="from" placeholder="Partenza" autocomplete="off" aria-label="Partenza">
    <button id="gps" title="Usa la mia posizione" aria-label="Usa la mia posizione">Io</button>
  </div>
  <div class="row"><input id="to" placeholder="Destinazione" autocomplete="off" aria-label="Destinazione"></div>
  <button class="main" id="go">Trova percorso senza gallerie</button>
  <p id="status" aria-live="polite"></p>
  <div id="res">
    <div class="badge" id="badge"></div>
    <div class="stats" id="stats"></div>
    <details><summary>Indicazioni passo passo</summary><ol id="steps"></ol></details>
    <button id="follow" class="main">Avvia navigazione guidata</button>
  </div>
  <p class="note">Le gallerie vengono riconosciute dai dati OpenStreetMap, che possono avere lacune (sottopassi sotto gli 80 m esclusi). Imposta il percorso da fermo.</p>
</section>
<script>
const $=s=>document.querySelector(s);
const map=L.map('map',{zoomControl:false}).setView([42.5,12.5],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
let here=null,cur=null,idx=1,watchId=null,meMarker=null;

const R=6371000,rad=Math.PI/180;
const hav=(a,b)=>{const dLa=(b[1]-a[1])*rad,dLo=(b[0]-a[0])*rad;const x=Math.sin(dLa/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const bear=(a,b)=>{const y=Math.sin((b[0]-a[0])*rad)*Math.cos(b[1]*rad),x=Math.cos(a[1]*rad)*Math.sin(b[1]*rad)-Math.sin(a[1]*rad)*Math.cos(b[1]*rad)*Math.cos((b[0]-a[0])*rad);return Math.atan2(y,x)/rad};
const dest=(p,b,d)=>{const la=p[1]*rad,lo=p[0]*rad,br=b*rad,dd=d/R;const la2=Math.asin(Math.sin(la)*Math.cos(dd)+Math.cos(la)*Math.sin(dd)*Math.cos(br));const lo2=lo+Math.atan2(Math.sin(br)*Math.sin(dd)*Math.cos(la),Math.cos(dd)-Math.sin(la)*Math.sin(la2));return[lo2/rad,la2/rad]};
const fmtD=m=>m>=1000?(m/1000).toFixed(m>=10000?0:1).replace('.',',')+' km':Math.round(m/10)*10+' m';
const fmtT=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min':m+' min'};

async function geocode(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
  const j=await r.json();
  if(!j.length)throw new Error('Non trovo «'+q+'». Prova con città e via.');
  return[+j[0].lon,+j[0].lat];
}
const CS=0.25,cache=new Map(),ck=p=>Math.floor(p[0]/CS)+'_'+Math.floor(p[1]/CS);
const OV=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const HW='^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$';
async function ovq(q){
  for(const u of OV){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q)});if(r.ok){const j=await r.json();if(j.elements)return j}}catch(e){}}
  throw new Error('overpass');
}
async function loadCells(keys){
  const miss=keys.filter(k=>!cache.has(k));
  for(let i=0;i<miss.length;i+=8){
    const part=miss.slice(i,i+8);
    const bb=k=>{const[x,y]=k.split('_').map(Number);return[y*CS,x*CS,(y+1)*CS,(x+1)*CS].join(',')};
    const q='[out:json][timeout:50];('+part.map(k=>'way["highway"~"'+HW+'"]["tunnel"~"^(yes|avalanche_protector)$"]('+bb(k)+');').join('')+');out geom;';
    const j=await ovq(q),tmp={};
    part.forEach(k=>tmp[k]=[]);
    const seen=new Set();
    for(const w of j.elements){
      if(seen.has(w.id)||!w.geometry)continue;seen.add(w.id);
      const g=w.geometry.map(p=>[p.lon,p.lat]);
      new Set(g.map(ck)).forEach(c=>{if(tmp[c])tmp[c].push({id:w.id,g})});
    }
    part.forEach(k=>cache.set(k,tmp[k]));
  }
}
async function tunnels(x){
  const co=x.r.geometry.coordinates,cells=new Set(co.map(ck));
  await loadCells([...cells]);
  const ways=new Map();cells.forEach(c=>(cache.get(c)||[]).forEach(w=>ways.set(w.id,w)));
  const H=new Map(),hk=(a,b)=>a+','+b;
  co.forEach((p,i)=>{const k=hk(Math.floor(p[0]*500),Math.floor(p[1]*500));if(!H.has(k))H.set(k,[]);H.get(k).push(i)});
  const near=p=>{const kx=Math.floor(p[0]*500),ky=Math.floor(p[1]*500);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const v=H.get(hk(kx+a,ky+b));if(v)for(const i of v)if(hav(p,co[i])<8)return i}return -1};
  const found=[];
  ways.forEach(w=>{
    const ix=w.g.map(near),m=ix.map(v=>v>=0);
    if(m.filter(Boolean).length<2)return;
    let len=0;const segs=[];
    for(let t=0;t<w.g.length-1;t++)if(m[t]&&m[t+1]){len+=hav(w.g[t],w.g[t+1]);segs.push({a:w.g[t],b:w.g[t+1]})}
    if(len<80)return;
    const mi=ix.filter(v=>v>=0);
    found.push({idx:Math.min(...mi),a:segs[0].a,b:segs.at(-1).b,len,segs});
  });
  found.sort((p,q)=>p.idx-q.idx);
  x.tun=found;x.tm=found.reduce((t,f)=>t+f.len,0);
  x.runs=found.reduce((n,f,k)=>n+(k&&hav(found[k-1].b,f.a)<150?0:1),0);
}
async function osrm(p,alt){
  const u='https://router.project-osrm.org/route/v1/driving/'+p.map(x=>x.join(',')).join(';')+'?overview=full&geometries=geojson&steps=true&alternatives='+(alt?'3':'false');
  const j=await(await fetch(u)).json();
  if(j.code!=='Ok')throw new Error('Nessun percorso stradale trovato tra questi punti.');
  const rs=j.routes.map(r=>({r,steps:r.legs.flatMap(l=>l.steps),dur:r.duration,dist:r.distance,tun:[],tm:0,runs:0,unk:false}));
  for(const x of rs){try{await tunnels(x)}catch(e){x.unk=true}}
  return rs;
}
function pick(list,base){
  const v=list.filter(x=>!x.unk);list=v.length?v:list;
  const ok=list.filter(x=>x.tm===0&&x.dur<=base*2.5+600);
  if(ok.length)return ok.reduce((a,b)=>a.dur<b.dur?a:b);
  return list.reduce((a,b)=>(a.tm-b.tm||a.dur-b.dur)<0?a:b);
}
async function find(a,b){
  $('#status').textContent='Cerco i percorsi e controllo le gallerie…';
  let all=await osrm([a,b],true);
  const base=Math.min(...all.map(x=>x.dur));
  let best=pick(all,base);
  for(let round=1;round<=2&&best.tm>0;round++){
    $('#status').textContent='Cerco una strada che eviti la galleria… ('+round+'/2)';
    const t=best.tun[0],mid=t.a,br=bear(t.a,t.b);
    const cands=[];
    for(const d of[700,2000,6000])for(const s of[90,-90])cands.push(dest(mid,br+s,d));
    const rs=await Promise.all(cands.map(c=>osrm([a,c,b],false).catch(()=>[])));
    all=all.concat(rs.flat());
    const nb=pick(all,base);
    if(nb===best)break;
    best=nb;
  }
  return best;
}

const MOD={left:'a sinistra',right:'a destra','slight left':'leggermente a sinistra','slight right':'leggermente a destra','sharp left':'decisamente a sinistra','sharp right':'decisamente a destra',uturn:'con inversione a U'};
function stepText(s){
  const m=s.maneuver,n=s.name?' su '+s.name:'',mod=MOD[m.modifier];
  switch(m.type){
    case'depart':return'Parti'+n;
    case'arrive':return'Sei arrivato a destinazione';
    case'roundabout':case'rotary':return'Alla rotonda prendi la '+(m.exit||'')+'ª uscita'+n;
    case'fork':return'Al bivio tieni '+(mod||'la strada')+n;
    case'merge':case'on ramp':return'Immettiti'+n;
    default:return!mod||m.modifier==='straight'?'Prosegui'+n:'Gira '+mod+n;
  }
}
function show(best,keep){
  cur=best;idx=1;layer.clearLayers();
  const ll=best.r.geometry.coordinates.map(c=>[c[1],c[0]]);
  L.polyline(ll,{color:'#fff',weight:11,opacity:.95}).addTo(layer);
  L.polyline(ll,{color:'#2C7A5B',weight:6}).addTo(layer);
  best.tun.forEach(t=>t.segs.forEach(g=>L.polyline([[g.a[1],g.a[0]],[g.b[1],g.b[0]]],{color:'#C0432B',weight:7,dashArray:'2 9',lineCap:'butt'}).addTo(layer)));
  [ll[0],ll.at(-1)].forEach((p,i)=>L.circleMarker(p,{radius:8,color:'#fff',weight:3,fillColor:i?'#1E2D35':'#2C7A5B',fillOpacity:1}).addTo(layer));
  if(!keep)map.fitBounds(L.polyline(ll).getBounds(),{padding:[40,40],paddingBottomRight:[40,320]});
  const ok=best.tm===0&&!best.unk;
  const sun='<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="9" fill="#F0B94B"/><g stroke="#F0B94B" stroke-width="3" stroke-linecap="round"><path d="M22 4v5M22 35v5M4 22h5M35 22h5M9.3 9.3l3.5 3.5M31.2 31.2l3.5 3.5M9.3 34.7l3.5-3.5M31.2 12.8l3.5-3.5"/></g></svg>';
  const warn='<svg viewBox="0 0 44 44" aria-hidden="true"><path d="M4 36V24C4 13 12 6 22 6s18 7 18 18v12z" fill="#C0432B"/><path d="M13 36V25c0-6 4-10 9-10s9 4 9 10v11z" fill="#FCEBD0"/></svg>';
  const b=$('#badge');b.className='badge'+(ok?'':' warn');
  b.innerHTML=best.unk?warn+'<div><b>Gallerie non verificate</b>Non riesco a consultare i dati sulle gallerie, quindi non posso garantire questo percorso. Riprova tra qualche minuto.</div>':ok?sun+'<div><b>Nessuna galleria</b>Controllato sui dati di OpenStreetMap.</div>'
    :warn+'<div><b>'+best.runs+(best.runs>1?' gallerie':' galleria')+' ('+fmtD(best.tm)+')</b>Non ho trovato un’alternativa ragionevole senza gallerie. Quelle sul percorso sono tratteggiate in rosso.</div>';
  $('#stats').innerHTML='<div>'+fmtT(best.dur)+'<br><span>durata</span></div><div>'+fmtD(best.dist)+'<br><span>distanza</span></div>';
  $('#steps').innerHTML=best.steps.map(s=>'<li>'+stepText(s)+' <em>'+(s.distance>0?fmtD(s.distance):'')+'</em></li>').join('');
  $('#res').style.display='block';
  $('#status').textContent='';
}

$('#gps').onclick=()=>{
  $('#status').textContent='Cerco la tua posizione…';
  navigator.geolocation.getCurrentPosition(p=>{here=[p.coords.longitude,p.coords.latitude];$('#from').value='La mia posizione';$('#status').textContent=''},
    ()=>{$('#status').textContent='Non riesco a leggere la posizione. Consenti l’accesso alla posizione nelle impostazioni del browser.'},{enableHighAccuracy:true});
};
$('#go').onclick=async()=>{
  const btn=$('#go');btn.disabled=true;
  try{
    const f=$('#from').value.trim(),t=$('#to').value.trim();
    if(!f||!t)throw new Error('Inserisci partenza e destinazione.');
    const a=(f==='La mia posizione'&&here)?here:await geocode(f);
    const b=await geocode(t);dst=b;
    show(await find(a,b));
  }catch(e){$('#status').textContent=e.message||'Qualcosa è andato storto. Riprova.'}
  btn.disabled=false;
};
let dst=null,said={},off=0,wl=null,rr=false,navOn=false;
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';speechSynthesis.speak(u)}catch(e){}};
const offRoute=pos=>{let m=1e9;for(const c of cur.r.geometry.coordinates){const d=hav(pos,c);if(d<m)m=d}return m};
async function startNav(){
  navOn=true;document.body.classList.add('nav');$('#banner').style.display='block';
  $('#bt').textContent='Navigazione avviata';$('#bs').textContent='';say('Navigazione avviata');
  said={};idx=1;off=0;
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  watchId=navigator.geolocation.watchPosition(onPos,()=>{$('#bs').textContent='Posizione non disponibile'},{enableHighAccuracy:true,maximumAge:1000});
}
function stopNav(){
  navOn=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;
  try{wl&&wl.release()}catch(e){}wl=null;try{speechSynthesis.cancel()}catch(e){}
  document.body.classList.remove('nav');$('#banner').style.display='none';
}
async function reroute(pos){
  rr=true;said={};say('Ricalcolo del percorso');$('#bt').textContent='Ricalcolo del percorso…';$('#bs').textContent='';
  try{show(await find(pos,dst),true)}catch(e){$('#bs').textContent='Ricalcolo non riuscito, riprovo'}
  idx=1;off=0;rr=false;
}
function onPos(p){
  const pos=[p.coords.longitude,p.coords.latitude],ll=[pos[1],pos[0]];
  if(!meMarker)meMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#2C7A5B',fillOpacity:1}).addTo(map);else meMarker.setLatLng(ll);
  map.setView(ll,17);
  if(!cur||rr)return;
  if(hav(pos,dst)<35){$('#bt').textContent='Sei arrivato';$('#bs').textContent='';say('Sei arrivato a destinazione');setTimeout(stopNav,6000);return}
  if(offRoute(pos)>70){if(++off>=3){reroute(pos);return}}else off=0;
  while(idx<cur.steps.length-1&&hav(pos,cur.steps[idx].maneuver.location)<30)idx++;
  const s=cur.steps[idx],d=hav(pos,s.maneuver.location);
  let rd=d,rt=0;for(let k=idx;k<cur.steps.length;k++){rd+=cur.steps[k].distance;rt+=cur.steps[k].duration}
  $('#bt').textContent=stepText(s);
  $('#bs').textContent='fra '+fmtD(d)+' · arrivo tra '+fmtT(rt)+' ('+fmtD(rd)+')';
  if(d<400&&!said[idx+'a']){said[idx+'a']=1;say('Fra '+(Math.max(1,Math.round(d/50))*50)+' metri, '+stepText(s))}
  if(d<60&&!said[idx+'b']){said[idx+'b']=1;say(stepText(s))}
}
$('#follow').onclick=startNav;
$('#stop').onclick=stopNav;
</script>
</body>
</html>
